<style>
:root{
  --bg:#12151A; --surf:#1B2029; --surf2:#232B39; --line:#2E3644;
  --tx:#E8ECF2; --mut:#8A96A6; --dim:#5B6675;
  --push:#E0524B; --pull:#4C8FD6; --legs:#4CAF7D; --gold:#D9A441;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --pad:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);font-family:var(--sans);
  font-size:16px;line-height:1.45;overscroll-behavior-y:none}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button,input,select{font-family:inherit;font-size:16px;color:inherit}
button{background:none;border:none;cursor:pointer}
a{color:var(--pull)}
.hd{position:sticky;top:0;z-index:40;background:rgba(18,21,26,.96);
  backdrop-filter:saturate(160%) blur(12px);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top)}
.datebar{display:flex;align-items:center;gap:8px;padding:9px var(--pad)}
.datebar .arw{width:40px;height:40px;border-radius:11px;background:var(--surf2);
  display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--mut);flex:0 0 auto}
.datebar .arw:active{background:var(--line)}
.dwrap{flex:1;min-width:0;text-align:center}
.dwrap .d1{font-size:15px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.dwrap .d2{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.09em;margin-top:1px}
.todaybtn{flex:0 0 auto;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--gold);border:1px solid var(--gold);border-radius:9px;padding:7px 9px;background:transparent}
.wrap{padding:var(--pad);max-width:760px;margin:0 auto}
.eyebrow{font-size:10.5px;font-weight:750;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
h2.scr{font-size:23px;font-weight:750;letter-spacing:-.02em;margin:2px 0 14px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:15px;margin-bottom:11px;overflow:hidden}
.card.push{border-left:3px solid var(--push)} .card.pull{border-left:3px solid var(--pull)}
.card.legs{border-left:3px solid var(--legs)}
.ch{padding:12px 14px}
.exname{font-size:16px;font-weight:680;letter-spacing:-.01em;line-height:1.25}
.meta{font-size:12px;color:var(--mut);margin-top:3px;font-variant-numeric:tabular-nums}
.tgtrow{display:flex;align-items:baseline;gap:9px;padding:2px 14px 10px}
.tgt{font-family:var(--mono);font-size:40px;font-weight:700;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;line-height:1}
.tgtlab{font-size:10.5px;font-weight:750;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.setrow{display:flex;align-items:center;gap:8px;padding:7px 14px;border-top:1px solid var(--line)}
.setn{width:26px;font-family:var(--mono);font-size:12px;color:var(--dim);flex:0 0 auto;font-weight:600}
.inp{flex:1;min-width:0;background:var(--surf2);border:1px solid var(--line);border-radius:10px;
  padding:11px 8px;text-align:center;font-family:var(--mono);font-size:17px;font-weight:600;
  font-variant-numeric:tabular-nums;outline:none;-moz-appearance:textfield}
.inp::-webkit-outer-spin-button,.inp::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.inp:focus{border-color:var(--mut);background:#28313F}
.inp::placeholder{color:var(--dim);font-weight:500}
.inp.filled{border-color:#3C4B5E;background:#252F3D}
.x{font-size:11px;color:var(--dim);flex:0 0 auto}
.drill{padding:11px 14px;border-top:1px solid var(--line)}
.drill:first-child{border-top:none}
.drill.pri{background:rgba(217,164,65,.07);border-left:2px solid var(--gold)}
.drill.golf{background:rgba(76,175,125,.07);border-left:2px solid var(--legs)}
.dn{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.dn b{font-size:14.5px;font-weight:650;flex:1 1 auto;min-width:0}
.dose{font-family:var(--mono);font-size:12px;color:var(--gold);font-weight:600;
  flex:0 1 auto;text-align:right;max-width:52%}
.dhow{font-size:13.5px;color:var(--mut);margin-top:5px;line-height:1.5}
.dcue{font-size:12.5px;color:var(--dim);margin-top:4px;font-style:italic}
.vid{display:inline-block;margin-top:7px;font-size:12px;font-weight:650;color:var(--pull);
  border:1px solid var(--line);border-radius:8px;padding:5px 9px;text-decoration:none}
.btn{display:block;width:100%;padding:13px;border-radius:12px;background:var(--surf2);
  border:1px solid var(--line);font-size:14px;font-weight:650;text-align:center;color:var(--tx)}
.btn:active{background:var(--line)}
.btn.gold{border-color:var(--gold);color:var(--gold)}
.btn.on{background:var(--legs);border-color:var(--legs);color:#0E1B14}
.btn.sm{padding:9px;font-size:13px}
.row2{display:flex;gap:9px} .row2>*{flex:1}
.seg{display:flex;background:var(--surf);border:1px solid var(--line);border-radius:12px;
  padding:3px;gap:3px;margin-bottom:13px}
.seg button{flex:1;padding:9px 4px;border-radius:9px;font-size:12.5px;font-weight:650;color:var(--mut)}
.seg button.on{background:var(--surf2);color:var(--tx)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:rgba(18,21,26,.97);backdrop-filter:saturate(160%) blur(12px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;padding:9px 2px 8px;font-size:10px;font-weight:650;color:var(--dim);
  letter-spacing:.02em;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button.on{color:var(--tx)}
.nav .ic{font-size:17px;line-height:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:10px;font-weight:700;color:var(--dim);letter-spacing:.06em;padding:5px 0}
.cell{aspect-ratio:1/1.12;background:var(--surf);border:1px solid var(--line);border-radius:9px;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:4px 1px 2px;gap:2px;position:relative}
.cell.off{opacity:.28}
.cell.today{border-color:var(--gold);border-width:1.5px}
.cell .dnum{font-family:var(--mono);font-size:11.5px;font-weight:650;color:var(--mut);font-variant-numeric:tabular-nums}
.cell.today .dnum{color:var(--gold)}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid transparent}
.cell .sl{font-family:var(--mono);font-size:8.5px;color:var(--dim);font-weight:650;line-height:1}
.cell .wt{font-family:var(--mono);font-size:8.5px;color:var(--gold);font-weight:650;line-height:1}
.cell .rest{font-size:8.5px;color:var(--dim);line-height:1}
.stat{display:flex;gap:9px;margin-top:13px}
.stat>div{flex:1;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:11px 9px;text-align:center}
.stat .v{font-family:var(--mono);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .l{font-size:9.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.09em;margin-top:2px}
.note{font-size:13px;color:var(--mut);line-height:1.55}
.warn{background:rgba(224,82,75,.1);border:1px solid rgba(224,82,75,.34);border-radius:12px;
  padding:11px 13px;font-size:13px;color:#F2A8A3;line-height:1.5;margin-bottom:11px}
.timer{position:fixed;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:45;
  background:var(--gold);color:#1A1206;border-radius:13px;padding:11px 15px;display:none;
  align-items:center;justify-content:space-between;box-shadow:0 8px 26px rgba(0,0,0,.5)}
.timer b{font-family:var(--mono);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.timer .lab{font-size:11px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;opacity:.72}
.timer button{font-size:12px;font-weight:750;color:#1A1206;border:1.5px solid rgba(26,18,6,.35);
  border-radius:9px;padding:6px 11px}
table.plan{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.plan th,table.plan td{border:1px solid var(--line);padding:6px 5px;font-size:12px;text-align:center}
table.plan th{background:var(--surf2);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
table.plan td.ex{text-align:left;font-size:12px;font-weight:600;min-width:150px;
  position:sticky;left:0;background:var(--surf);z-index:1}
table.plan td{font-family:var(--mono)}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px}
.hist{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.hist .hv{font-family:var(--mono);font-weight:650;font-variant-numeric:tabular-nums}
select.sel{width:100%;background:var(--surf2);border:1px solid var(--line);border-radius:11px;
  padding:12px;font-size:15px;color:var(--tx);outline:none}
textarea{width:100%;background:var(--surf2);border:1px solid var(--line);border-radius:11px;
  padding:11px;font-family:var(--mono);font-size:12px;color:var(--tx);min-height:110px;outline:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));
  background:var(--tx);color:var(--bg);padding:10px 17px;border-radius:11px;font-size:13.5px;
  font-weight:650;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
hr.sep{border:none;border-top:1px solid var(--line);margin:19px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

,"Functional Trainer + D-Handle","Anti-Rotation","Side-on to the pulley, press straight out. Resist the twist."],["Cable Anti-Rotation Hold","Core","Core","Functional Trainer + D-Handle","Anti-Rotation","Arms extended, hold 20-30 seconds. Brutal and quiet."],["Dumbbell Side Bend","Core","Obliques","Dumbbells","Lateral Flexion","One bell only. Don't lean toward the loaded side."],["Dumbbell Russian Twist","Core","Obliques","Dumbbells","Rotation","Seated, feet up. Rotate from the ribs, not the arms."],["Dumbbell Overhead Carry","Core","Core / Shoulders","Dumbbells","Carry","One bell locked out overhead. Walk tall."],["Dead Bug","Core","Core","Bodyweight","Anti-Extension","Low back stays flat on the floor. Opposite arm and leg."],["Bird Dog","Core","Core / Glutes","Bodyweight","Anti-Rotation","Quadruped, opposite arm and leg. No hip tilt."],["Hollow Body Hold","Core","Core","Bodyweight","Anti-Extension","Low back pressed down. Shorten the lever if it lifts."],["Reverse Crunch","Core","Lower Abs","Bodyweight","Spinal Flexion","Curl the hips off the floor. Slow on the way down."],["V-Up","Core","Abs","Bodyweight","Spinal Flexion","Hands and feet meet over the hips."],["Barbell Landmine Rotation","Core","Obliques","Barbell + Landmine","Rotation","Bar end at chest height, sweep side to side. Excellent golf carryover."],["Incline Treadmill Walk (Zone 2)","Conditioning","Cardio","Treadmill","Steady State","10-15% incline, 2.8-3.4 mph, 30-45 min. Heart rate 114-133 bpm. The main fat-loss tool."],["Incline Treadmill Walk (Steep)","Conditioning","Cardio","Treadmill","Steady State","15%+ incline, slower speed. Hold the rails only if you must."],["Treadmill Walk (Flat, Recovery)","Conditioning","Cardio","Treadmill","Recovery","0-3% incline, easy pace. Rest-day movement."],["Treadmill Intervals (Walk/Jog)","Conditioning","Cardio","Treadmill","Interval","Revisit around 200 lb bodyweight. Joint load is high at 235."],["Rower Steady State (Zone 2)","Conditioning","Cardio","Rower","Steady State","20-30 min conversational pace. Legs-core-arms, reverse on the return."],["Rower Intervals 250m","Conditioning","Cardio","Rower","Interval","8-10 rounds, equal rest. Short and sharp."],["Rower Intervals 500m","Conditioning","Cardio","Rower","Interval","5-6 rounds, 90 sec rest. The classic conditioning set."],["Rower Intervals 1000m","Conditioning","Cardio","Rower","Interval","3-4 rounds, 2-3 min rest. Harder than it reads."],["Rower 2000m Time Trial","Conditioning","Cardio","Rower","Test","All out. Retest monthly as a conditioning benchmark."],["Rower Pyramid","Conditioning","Cardio","Rower","Interval","250-500-750-1000-750-500-250m, rest equal to work time."],["Weighted Vest Walk","Conditioning","Cardio","Weighted Vest (Tier 2 buy)","Steady State","20-40 lb vest, flat or light incline. Big calorie bump."],["Dumbbell Farmer Carry Finisher","Conditioning","Conditioning","Dumbbells","Carry","Heavy bells, walk until the grip goes. 3-4 rounds."],["Dumbbell Swing","Conditioning","Conditioning","Dumbbells","Hip Hinge","One bell, hinge and snap the hips. Not a squat, not a front raise."],["Dumbbell Thruster Complex","Conditioning","Conditioning","Dumbbells","Complex","Squat into an overhead press. 10-15 reps gets brutal fast."],["Barbell Complex","Conditioning","Conditioning","Barbell","Complex","Empty or light bar: row, clean, press, squat, RDL. 5 reps each, no rest."],["Treadmill Incline Intervals","Conditioning","Cardio","Treadmill","Interval","3 min at 15%, 2 min at 5%. Repeat 5-6 rounds."],["Outdoor Walk (Steps)","Conditioning","Cardio","None","Steady State","Counts toward the 8-10k daily step target."],["Dumbbell Snatch Intervals","Conditioning","Conditioning","Dumbbells","Complex","One bell, floor to overhead. 30 sec on / 30 sec off."],["Treadmill Warm-Up Walk (5 min)","Warm-Up","General","Treadmill","Warm-Up","Easy incline walk to raise core temperature before lifting."],["Rower Warm-Up (3 min)","Warm-Up","General","Rower","Warm-Up","Light pace. Good general warm-up before pull days."],["Empty Bar Warm-Up Set","Warm-Up","Specific","Barbell","Warm-Up","10-15 reps with just the bar. Groove the pattern."],["Ramp-Up Set (50%)","Warm-Up","Specific","Barbell","Warm-Up","5 reps at 50% of the working weight."],["Ramp-Up Set (70%)","Warm-Up","Specific","Barbell","Warm-Up","3 reps at 70% of the working weight."],["Ramp-Up Set (85%)","Warm-Up","Specific","Barbell","Warm-Up","1-2 reps at 85%. Primes the nervous system, no fatigue."],["Cable External Rotation","Warm-Up","Rotator Cuff","Functional Trainer + D-Handle","Warm-Up","Elbow at the ribs, rotate out. Very light, 15-20 reps."],["Cable Face Pull (Warm-Up)","Warm-Up","Rear Delts","Functional Trainer + Rope","Warm-Up","Light, 20 reps. Wakes up the upper back before pressing."],["Bodyweight Squat Warm-Up","Warm-Up","Legs","Bodyweight","Warm-Up","20 reps, progressively deeper."],["Dead Hang (Warm-Up)","Warm-Up","Lats / Grip","Rack Pull-Up Bar","Warm-Up","30 seconds. Opens the shoulders before pulling."],["Cat-Cow","Mobility - Dynamic","Spine","Bodyweight","Dynamic Mobility","Segment the spine. Breathe out on the round, in on the arch."],["Open Book","Mobility - Dynamic","T-Spine","Bodyweight","Dynamic Mobility","Side-lying, knees stacked. Follow the hand with your eyes."],["Wall Slide","Mobility - Dynamic","Shoulders","Wall","Dynamic Mobility","Forearms on the wall, slide up. Ribs stay down."],["Scap Push-Up","Mobility - Dynamic","Serratus","Bodyweight","Dynamic Mobility","Plank position, arms locked. Only the shoulder blades move."],["Arm Circles","Mobility - Dynamic","Shoulders","Bodyweight","Dynamic Mobility","Small to large, both directions. Blood flow, not stretching."],["Thread the Needle","Mobility - Dynamic","T-Spine","Bodyweight","Dynamic Mobility","Quadruped, reach one arm under the body then up to the ceiling."],["Prone Y-T-W","Mobility - Dynamic","Upper Back","Bench / Floor","Dynamic Mobility","Face down, no weight. Y, then T, then W. 5 each."],["Scap Pull-Up (Mob bility - Static","Hamstrings","Bodyweight / Strap","Static Stretch","On your back, one leg up. Other leg stays flat on the floor."],["Lat Stretch on Bench","Mobility - Static","Lats","Bench","Static Stretch","Kneel, elbows on the bench, sink the chest toward the floor."],["Elevated Hamstring Stretch","Mobility - Static","Hamstrings","Bench","Static Stretch","Heel on the bench, hinge from the hips with a flat back."],["Supine Spinal Twist","Mobility - Static","T-Spine / Glutes","Bodyweight","Static Stretch","On your back, knee across the body. Shoulders stay down."],["Couch Stretch","Mobility - Static","Hip Flexors / Quads","Bench / Wall","Static Stretch","Rear shin vertical against the bench. The hardest and best hip flexor stretch."],["90/90 Hip Hold","Mobility - Static","Hip Rotation","Bodyweight","Static Stretch","Hold the 90/90 position, lean over the front shin."],["Standing Toe Touch","Mobility - Static","Hamstrings","Bodyweight","Static Stretch","Soft knees, hang. Let gravity do it. Your toe-touch benchmark drill."],["Rack Chest Stretch (Low)","Mobility - Static","Chest","Rack","Static Stretch","Hand low on the upright, turn away. Hits the lower pec fibres."],["Child's Pose","Mobility - Static","Lats / Lower Back","Bodyweight","Static Stretch","Knees wide, hips to heels, arms long."],["Pigeon Stretch","Mobility - Static","Glutes / Hip Rotation","Bodyweight / Bench","Static Stretch","Front shin across, hips square. Use the bench if the floor is too aggressive."],["Seated Forward Fold","Mobility - Static","Hamstrings","Bodyweight","Static Stretch","Seated, legs straight, hinge from the hips."],["Standing Quad Stretch","Mobility - Static","Quads","Rack","Static Stretch","Hold the rack, heel to the glute, tuck the pelvis."],["Calf Stretch on Rack","Mobility - Static","Calves","Rack / Plate","Static Stretch","Ball of the foot on a plate, heel drops. Straight leg then bent."],["Cross-Body Shoulder Stretch","Mobility - Static","Rear Delts","Bodyweight","Static Stretch","Arm across the chest, pull with the other forearm."],["Triceps Overhead Stretch","Mobility - Static","Triceps / Lats","Bodyweight","Static Stretch","Hand behind the neck, gently press the elbow back."],["Butterfly Stretch","Mobility - Static","Adductors","Bodyweight","Static Stretch","Soles together, hinge forward from the hips."],["Figure-4 Glute Stretch","Mobility - Static","Glutes","Bodyweight","Static Stretch","Ankle across the opposite knee, pull the far thigh in."],["Seated Thoracic Rotation (Dowel)","Mobility - Golf","T-Spine Rotation","Barbell / Dowel","Golf Mobility","Seated, dowel across the shoulders, knees squeezed. Rotate without the hips moving."],["Half-Kneeling T-Spine Rotation","Mobility - Golf","T-Spine Rotation","Bodyweight","Golf Mobility","Half-kneeling locks the pelvis so the rotation has to come from the ribcage."],["90/90 Hip Internal Rotation Lift-Off","Mobility - Golf","Hip Internal Rotation","Bodyweight","Golf Mobility","From 90/90, lift the back shin off the floor. PGA average is 45 deg per side."],["Seated Hip Internal Rotation Stretch","Mobility - Golf","Hip Internal Rotation","Bench","Golf Mobility","Seated on the bench, sweep one foot out to rotate the thigh inward."],["Wall Angel","Mobility - Golf","Shoulders / T-Spine","Wall","Golf Mobility","Back, head, arms on the wall. Slide up without the low back arching."],["Golf Posture Rotation Drill","Mobility - Golf","T-Spine / Hips","Barbell / Dowel","Golf Mobility","Set your actual golf posture, dowel on the shoulders, rotate to backswing and through."],["Standing Trunk Rotation (Dowel)","Mobility - Golf","T-Spine Rotation","Barbell / Dowel","Golf Mobility","Feet planted, rotate the ribcage. Hips stay quiet."],["Side-Lying Windmill","Mobility - Golf","T-Spine Rotation","Bodyweight","Golf Mobility","Side-lying, top arm sweeps a big circle overhead and back."]],"ramp":[["2026-08-17","Mon","Rest + Walk","20 min flat treadmill walk. Unpack the rack. Weigh in - this is your 235 lb baseline."],["2026-08-18","Tue","Push (ramp)","15 min. Empty bar bench 2x10, empty bar OHP 2x10, push-ups 2x10. Stop early. Full warm-up + cool-down."],["2026-08-19","Wed","Pull (ramp)","15 min. Barbell row 2x10 light, band or assisted pull-ups 2x5, DB curl 2x12. Full warm-up + cool-down."],["2026-08-20","Thu","Legs (ramp)","15 min. Bodyweight squat 2x15, empty bar RDL 2x10, calf raise 2x15. Expect soreness - that's the point."],["2026-08-21","Fri","Push (ramp)","15 min. Same as Tuesday, add ~10-20 lb if Tuesday left you fine."],["2026-08-22","Sat","Pull (ramp)","15 min. Same as Wednesday, slightly heavier."],["2026-08-23","Sun","Legs (ramp)","15 min. Same as Thursday, add light load to the squat."],["2026-08-24","Mon","Rest + Walk","30 min incline walk. Start the 8-10k step habit."],["2026-08-25","Tue","Push (ramp)","20 min. Work up to a moderate bench triple. Still nowhere near failure."],["2026-08-26","Wed","Pull (ramp)","20 min. Work up on rows. Test your max strict pull-ups (don't grind)."],["2026-08-27","Thu","Legs (ramp)","20 min. Work up on squats. TEST THE SAFETY HEIGHT with an empty bar - bail into them deliberately."],["2026-08-28","Fri","Rest + Walk","30-40 min incline walk. Rest up for the test days."],["2026-08-29","Sat","BASELINE TEST - Push + Pull","Find a weight you can do for the TOP of each rep range with 2 reps left in the tank. That number goes in Week 1 TARGET."],["2026-08-30","Sun","BASELINE TEST - Legs","Same for the leg lifts. Conservative beats heroic - the program adds weight for you every week."],["2026-08-31","Mon","Rest + Flexibility Baseline","Run all 6 tests on the Flexibility Tests tab. Take front/side/back photos. Program 1 starts tomorrow."]],"mob":{"warmup":{"push":[{"n":"Cat-Cow","dose":"8 reps","how":"On hands and knees, hands under shoulders and knees under hips. Exhale as you push the floor away and round your upper back toward the ceiling, tucking your chin and tailbone. Inhale as you reverse it: chest forward, tailbone up, eyes up. Move slowly and try to feel the spine moving segment by segment rather than hinging at one spot.","cue":"Round then arch, one vertebra at a time.","url":"https://www.youtube.com/results?search_query=cat+cow+stretch+how+to","pri":false},{"n":"Open Book","dose":"6 / side","how":"Lie on your side with knees bent to 90 degrees and stacked, arms straight out in front at shoulder height. Keep the bottom knee pinned to the floor, then sweep the top arm up and over to the other side like opening a book, turning your head to follow the hand. Let the chest open as far as it will go without the knees lifting. Return under control.","cue":"Side-lying, top arm sweeps open. Follow the hand with your eyes.","url":"https://www.youtube.com/results?search_query=open+book+thoracic+rotation+stretch","pri":false},{"n":"Wall Slide","dose":"10 reps","how":"Stand facing a wall with forearms on it, elbows about shoulder height and shoulder-width apart. Brace your abs so your ribs do not flare, then slide the forearms up the wall as high as you can while keeping contact and keeping the shoulders down away from the ears. Slide back down slowly. If your low back arches, you have gone too far.","cue":"Forearms on the wall, slide up. Ribs stay down.","url":"https://www.youtube.com/results?search_query=wall+slide+shoulder+mobility+exercise","pri":false},{"n":"Scap Push-Up","dose":"10 reps","how":"Get into a push-up or high plank position with arms completely straight and locked. Without bending the elbows at all, let your chest sink slightly as the shoulder blades pinch together, then push the floor away hard so the upper back rounds and the blades spread apart. That small range is the whole rep. It wakes up the serratus, which stabilises everything you press.","cue":"Plank with locked arms. Only the shoulder blades move.","url":"https://www.youtube.com/results?search_query=scapular+push+up+how+to","pri":false},{"n":"Arm Circles","dose":"10 each way","how":"Stand tall with arms out to the sides. Make small circles forward, gradually growing them until you are making the biggest circles your shoulders allow, then reverse and work back down. This is about blood flow and joint fluid, not stretching, so keep it brisk and comfortable.","cue":"Small to large, both directions.","url":"https://www.youtube.com/results?search_query=arm+circles+warm+up+shoulders","pri":false}],"pull":[{"n":"Cat-Cow","dose":"8 reps","how":"On hands and knees, hands under shoulders and knees under hips. Exhale as you push the floor away and round your upper back toward the ceiling, tucking your chin and tailbone. Inhale as you reverse it: chest forward, tailbone up, eyes up. Move slowly and try to feel the spine moving segment by segment rather than hinging at one spot.","cue":"Round then arch, one vertebra at a time.","url":"https://www.youtube.com/results?search_query=cat+cow+stretch+how+to","pri":false},{"n":"Thread the Needle","dose":"6 / side","how":"On hands and knees, slide one arm underneath your body and across, letting that shoulder and the side of your head rest toward the floor. Pause, then reverse it: reach that same arm up toward the ceiling and open the chest, following the hand with your eyes. Keep the hips stacked over the knees the whole time so the rotation comes from the upper back.","cue":"Quadruped, reach one arm under the body, then up.","url":"https://www.youtube.com/results?search_query=thread+the+needle+stretch+thoracic+spine","pri":false},{"n":"Prone Y-T-W","dose":"5 each","how":"Lie face down on the floor or a low incline bench with your forehead resting down. With no weight at all, lift your arms into a Y overhead, lower, then out into a T at shoulder height, lower, then bent into a W with elbows tucked, squeezing the shoulder blades. Five of each. Go light; this is for the small upper back muscles, not the delts.","cue":"Face down, no weight. Y, then T, then W.","url":"https://www.youtube.com/results?search_query=prone+Y+T+W+exercise+upper+back","pri":false},{"n":"Scap Pull-Up (Mobility)","dose":"8 reps","how":"Hang from the pull-up bar with arms completely straight. Without bending the elbows, pull your shoulder blades down and back so your body rises an inch or two, then let it lower again. This teaches the lats to initiate a pull-up and is a good gauge of whether your shoulders are ready to pull.","cue":"Hang with straight arms, pull the shoulder blades down.","url":"https://www.youtube.com/results?search_query=scapular+pull+up+how+to","pri":false},{"n":"Dead Hang (Mobility)","dose":"30 sec","how":"Hang from the pull-up bar with a full grip and let everything relax: shoulders up by the ears is fine here, this is a passive hang. Breathe. Thirty seconds. It decompresses the spine, opens the lats and shoulders, and builds grip for free.","cue":"Just hang and relax for 30 seconds.","url":"https://www.youtube.com/results?search_query=dead+hang+benefits+how+to","pri":false}],"legs":[{"n":"90/90 Hip Switch","dose":"8 / side","how":"Sit on the floor with one leg in front bent to 90 degrees and the other out to the side also bent to 90. Keep the chest tall. Lift both knees and rotate them across to the other side so the positions swap, then back. If sitting upright is hard, put your hands behind you. This is the single most useful hip drill you can do, and it directly trains the internal rotation your golf swing needs.","cue":"Seated, knees at 90/90, rotate side to side.","url":"https://www.youtube.com/results?search_query=90+90+hip+switch+mobility+drill","pri":false},{"n":"Ankle Knee-to-Wall","dose":"10 / side","how":"Stand facing a wall with the toes of one foot a few inches from it. Keeping the heel flat on the floor, drive that knee forward until it touches the wall. If it touches easily, slide the foot further back and try again. Ten controlled reps per side. Ankle range is what lets you squat deep and lets your trail foot work in the swing.","cue":"Drive the knee over the toes with the heel down.","url":"https://www.youtube.com/results?search_query=knee+to+wall+ankle+mobility+test","pri":false},{"n":"Leg Swings (Front/Back)","dose":"10 / side","how":"Hold a rack upright for balance and swing one leg forward and back in a controlled arc, letting the range grow over ten reps. Keep the torso upright and the standing knee soft. This is dynamic, so do not hold the end range.","cue":"Hold the rack, swing one leg front to back.","url":"https://www.youtube.com/results?search_query=leg+swings+front+to+back+warm+up","pri":false},{"n":"Leg Swings (Side)","dose":"10 / side","how":"Facing the rack and holding on, swing one leg across the front of your body and then out to the side, ten times, letting the range build. Keep the hips square and the torso quiet so the movement happens at the hip joint.","cue":"Swing the leg across the body and out.","url":"https://www.youtube.com/results?search_query=lateral+leg+swings+warm+up","pri":false},{"n":"Squat to Stand","dose":"8 reps","how":"Stand with feet shoulder-width, bend forward and grab your toes. Keeping hold of them, pull yourself down into the deepest squat you can with the chest lifted, feeling the hips open. Then, still holding the toes, straighten the legs as much as you can to stretch the hamstrings. That is one rep. Eight of them and your hips and hamstrings are ready to squat.","cue":"Grab the toes, sink to a deep squat, chest up, then straighten.","url":"https://www.youtube.com/results?search_query=squat+to+stand+mobility+drill","pri":false}]},"cooldown":{"push":[{"n":"Rack Pec Stretch","dose":"45 sec / side","how":"Put your forearm flat against a rack upright with the elbow at about shoulder height, then step through and rotate your body away from that arm until you feel the chest open. Breathe and hold, do not bounce. Forty-five seconds per side. Adjust the elbow higher or lower to move the stretch around the chest.","cue":"Forearm on the upright, turn away. 45 sec per side.","url":"https://www.youtube.com/results?search_query=doorway+pec+stretch+how+to","pri":false},{"n":"Half-Kneeling Hip Flexor Stretch","dose":"60 sec / side","how":"Kneel on one knee with the other foot forward, both knees roughly 90 degrees. Put something soft under the down knee. Before you move anything, squeeze the glute on the kneeling side as hard as you can. That posteriorly tilts the pelvis and is where the actual stretch comes from. Only then shift your weight slightly forward. Most people skip the glute squeeze and just lean, which stretches the low back instead of the hip flexor. Sixty seconds per side.","cue":"Squeeze the back glute HARD, then tuck the pelvis.","url":"https://www.youtube.com/results?search_query=half+kneeling+hip+flexor+stretch+glute+squeeze","pri":true},{"n":"Supine Hamstring Stretch","dose":"45 sec / side","how":"Lie on your back with both legs straight. Raise one leg toward the ceiling, holding behind the thigh or using a strap or belt around the foot. The key is that the other leg stays flat on the floor. Keep the raised knee as straight as you can and pull only to a mild, easy tension. Forty-five seconds per side.","cue":"On your back, one leg up, other leg flat.","url":"https://www.youtube.com/results?search_query=supine+hamstring+stretch+with+strap","pri":true}],"pull":[{"n":"Lat Stretch on Bench","dose":"45 sec / side","how":"Kneel in front of the bench and place your elbows on it, hands together or holding a towel. Sit your hips back toward your heels and let your chest sink toward the floor, so you feel it down the sides of your back under the armpits. To bias one side, walk both hands slightly toward the opposite side. Forty-five seconds per side.","cue":"Kneel, elbows on the bench, sink the chest.","url":"https://www.youtube.com/results?search_query=kneeling+lat+stretch+on+bench","pri":false},{"n":"Elevated Hamstring Stretch","dose":"75 sec / side","how":"Put one heel on the bench with the leg straight and toes pointing up. Stand tall, then hinge forward from the hips with a flat back, chest leading, until you feel the hamstring. Do not round the spine to reach further; the flat back is what puts the stretch in the muscle. Seventy-five seconds per side. This is your biggest single hamstring dose of the week.","cue":"Heel on the bench, hinge with a flat back.","url":"https://www.youtube.com/results?search_query=elevated+hamstring+stretch+flat+back","pri":true},{"n":"Supine Spinal Twist","dose":"30 sec / side","how":"Lie on your back, bring one knee up and let it fall across your body toward the floor on the other side, using the opposite hand to guide it. The priority is keeping both shoulder blades on the floor. Turn your head the other way if it is comfortable. Thirty seconds per side.","cue":"On your back, knee across the body, shoulders down.","url":"https://www.youtube.com/results?search_query=supine+spinal+twist+stretch","pri":false}],"legs":[{"n":"Couch Stretch","dose":"90 sec / side","how":"Face away from the bench in a half-kneeling position and place the top of your rear foot up against the pad so the shin is vertical. Squeeze the rear glute hard and tuck the pelvis, then bring the torso upright as far as you can tolerate. This is the most aggressive hip flexor and quad stretch there is, so start with the torso leaned forward and work toward upright over weeks. Ninety seconds per side. Pad the down knee.","cue":"Rear shin vertical against the bench. Squeeze the glute.","url":"https://www.youtube.com/results?search_query=couch+stretch+how+to+progression","pri":true},{"n":"90/90 Hip Hold","dose":"60 sec / side","how":"Sit in the 90/90 position, front leg bent 90 in front and back leg bent 90 out to the side. Sit tall for a moment, then hinge forward over the front shin and hold. You should feel the outside of the front hip. Sixty seconds per side. Swap which leg is in front.","cue":"Hold the 90/90, lean over the front shin.","url":"https://www.youtube.com/results?search_query=90+90+hip+stretch+hold","pri":true},{"n":"Standing Toe Touch","dose":"60 sec","how":"Stand with feet together, soften the knees slightly, and fold forward, letting your arms and head hang heavy. Do not pull or bounce. Just breathe out and let the hamstrings release for a full sixty seconds. This is the same position as your toe-touch benchmark test, so it doubles as practice.","cue":"Soft knees, hang, let gravity do it.","url":"https://www.youtube.com/results?search_query=standing+forward+fold+hamstring+stretch","pri":true}]},"golf":[{"n":"Seated Thoracic Rotation (Dowel)","dose":"8 / side","how":"Sit on the bench with a dowel or empty barbell across the back of your shoulders and squeeze a pad or your fist between your knees. Squeezing the knees locks the pelvis, so any rotation you get has to come from the ribcage rather than the hips. Rotate as far as you can each way, eight per side. This is the direct trainer for the number your swing depends on.","cue":"Dowel on shoulders, knees squeezed, rotate.","url":"https://www.youtube.com/results?search_query=seated+thoracic+rotation+golf+drill","pri":false},{"n":"Half-Kneeling T-Spine Rotation","dose":"8 / side","how":"Half-kneel with hands behind your head. Squeeze the down-side glute to lock the pelvis, then rotate your ribcage toward the up knee, leading with the elbow, and come back. Because the hips cannot help, everything you get is real thoracic range.","cue":"Half-kneeling locks the pelvis. Rotate from the ribs.","url":"https://www.youtube.com/results?search_query=half+kneeling+thoracic+rotation+golf","pri":false},{"n":"Open Book","dose":"8 / side","how":"Lie on your side with knees bent to 90 degrees and stacked, arms straight out in front at shoulder height. Keep the bottom knee pinned to the floor, then sweep the top arm up and over to the other side like opening a book, turning your head to follow the hand. Let the chest open as far as it will go without the knees lifting. Return under control.","cue":"Side-lying, top arm sweeps open. Follow the hand with your eyes.","url":"https://www.youtube.com/results?search_query=open+book+thoracic+rotation+stretch","pri":false},{"n":"Thread the Needle","dose":"8 / side","how":"On hands and knees, slide one arm underneath your body and across, letting that shoulder and the side of your head rest toward the floor. Pause, then reverse it: reach that same arm up toward the ceiling and open the chest, following the hand with your eyes. Keep the hips stacked over the knees the whole time so the rotation comes from the upper back.","cue":"Quadruped, reach one arm under the body, then up.","url":"https://www.youtube.com/results?search_query=thread+the+needle+stretch+thoracic+spine","pri":false},{"n":"Side-Lying Windmill","dose":"6 / side","how":"Lie on your side, knees bent and stacked, arms together straight out in front. Sweep the top arm in a big slow circle up overhead, around behind you, and back to the start, keeping the hand as close to the floor as it will go and letting the chest open. Six per side.","cue":"Top arm sweeps a big circle overhead and back.","url":"https://www.youtube.com/results?search_query=side+lying+windmill+thoracic+mobility","pri":false},{"n":"Wall Angel","dose":"10 reps","how":"Stand with your back against the wall, feet a few inches out, and press the low back flat. Put your arms on the wall in a goalpost shape with the backs of the hands touching. Slide the arms up and down while keeping the hands, elbows, and low back in contact. If the low back arches or the hands lift, stop there; that is your current range.","cue":"Back and arms on the wall, slide up, low back flat.","url":"https://www.youtube.com/results?search_query=wall+angels+exercise+how+to","pri":false},{"n":"90/90 Hip Internal Rotation Lift-Off","dose":"8 / side","how":"Sit in the 90/90 position. Keeping your torso still and hands off the floor if you can, lift the rear leg's shin and knee off the floor by rotating that hip internally. It will be a small movement and it will burn. Hold two seconds, eight reps per side. Tour players average 45 degrees of hip internal rotation on both sides; most people who sit at a desk have 20 to 30, and the difference is where back pain comes from.","cue":"From 90/90, lift the back shin off the floor.","url":"https://www.youtube.com/results?search_query=90+90+hip+internal+rotation+lift+off","pri":false},{"n":"Seated Hip Internal Rotation Stretch","dose":"45 sec / side","how":"Sit on the bench with knees bent and feet on the floor. Keeping the knee still, sweep one foot out to the side, which rotates the thigh bone inward in the socket. Hold at the end range for forty-five seconds per side. Very simple, very effective, and directly targets the tour-average benchmark.","cue":"Seated on the bench, sweep the foot outward.","url":"https://www.youtube.com/results?search_query=seated+hip+internal+rotation+stretch","pri":false},{"n":"Hip Airplane","dose":"6 / side","how":"Hold the rack, stand on one leg and hinge forward so your torso and free leg form a straight line. From there, rotate your pelvis open toward the ceiling, then closed toward the floor, keeping the standing leg still. Slow and small is fine. This trains hip internal and external rotation under load, which is exactly what a golf swing demands.","cue":"Single-leg hinge, rotate the pelvis open and closed.","url":"https://www.youtube.com/results?search_query=hip+airplane+exercise+how+to","pri":false},{"n":"Adductor Rock Back","dose":"10 reps","how":"On hands and knees, extend one leg straight out to the side with the foot flat and the toes pointing forward. Keeping that leg straight, rock your hips back toward your heel until you feel the inner thigh stretch, then rock forward. Ten reps, then switch.","cue":"Quadruped, one leg out to the side, rock the hips back.","url":"https://www.youtube.com/results?search_query=adductor+rock+back+stretch","pri":false},{"n":"Ankle Knee-to-Wall","dose":"10 / side","how":"Stand facing a wall with the toes of one foot a few inches from it. Keeping the heel flat on the floor, drive that knee forward until it touches the wall. If it touches easily, slide the foot further back and try again. Ten controlled reps per side. Ankle range is what lets you squat deep and lets your trail foot work in the swing.","cue":"Drive the knee over the toes with the heel down.","url":"https://www.youtube.com/results?search_query=knee+to+wall+ankle+mobility+test","pri":false},{"n":"Golf Posture Rotation Drill","dose":"10 / side","how":"Take your actual address posture, hinged at the hips with a neutral spine, and hold a dowel or empty bar across your shoulders. Rotate into your backswing position and then through to the finish, keeping the spine angle you started with. The point is to train rotation in the posture you will actually use, not just sitting on a bench.","cue":"Set your real golf posture, dowel on shoulders, rotate.","url":"https://www.youtube.com/results?search_query=golf+posture+rotation+drill+with+club","pri":false}],"tests":[{"n":"Toe Touch","how":"Feet together, knees straight. Measure fingertips to floor in inches (negative = past the floor).","target":"Palms flat on floor"},{"n":"Ankle Knee-to-Wall","how":"Big toe from wall, drive knee to wall with heel down. Measure inches, each side.","target":"5+ in. both sides"},{"n":"Seated Trunk Rotation","how":"Seated on bench, dowel on shoulders, knees squeezed. Degrees rotated each way.","target":"60 deg each way"},{"n":"Hip Internal Rotation","how":"Seated on bench, sweep foot outward. Degrees of shin travel, each side.","target":"45 deg each side (PGA tour average)"},{"n":"Shoulder Flexion","how":"Lie on back, low back flat, arms overhead. Do the hands touch the floor?","target":"Hands flat, low back flat"},{"n":"Thomas Test","how":"Sit on bench edge, roll back, pull one knee in. Does the other thigh rest flat?","target":"Thigh flat on bench"}],"volume":{"Chest / Shoulders":3.0,"Hip Flexors":10.0,"Hamstrings":10.0,"Lats":3.0,"T-Spine":2.0,"Hip Rotation":4.0},"cost":{"Push":5.0,"Pull":5.0,"Legs":6.0}},"ref":{"baseWeight":235,"cal":2400,"protein":190,"fat":75,"carbs":240,"hrLow":114,"hrHigh":133}};

/* ---------------------------------------------------------------- state */
var KEY = "kb_gym_v1";
var BLANK = {base:{},logs:{},extras:{},weights:{},ramp:{},tweak:{},flex:{},done:{}};
var S = loadState();
function loadState(){
  var o = JSON.parse(JSON.stringify(BLANK));
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){ var p = JSON.parse(raw); for(var k in BLANK) if(p[k]) o[k] = p[k]; }
  }catch(e){}
  return o;
}
var saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    try{ localStorage.setItem(KEY, JSON.stringify(S)); }
    catch(e){ toast("Couldn't save — storage may be full"); }
  }, 120);
}
function toast(m){
  var t = document.getElementById("toast");
  t.textContent = m; t.classList.add("on");
  setTimeout(function(){ t.classList.remove("on"); }, 1700);
}

/* ---------------------------------------------------------------- dates */
function ds(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function pd(s){ var a=s.split("-").map(Number); return new Date(a[0],a[1]-1,a[2]); }
function addDays(d,n){ var x=new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
function daysBetween(a,b){ return Math.round((pd(ds(b))-pd(ds(a)))/86400000); }
var TODAY = new Date();
var viewDate = new Date();

var PHASES = [
  {k:"ramp",   a:"2026-08-17", b:"2026-08-31", label:"Ramp-up"},
  {k:"p1",     a:"2026-09-01", b:"2026-11-23", label:"Program 1"},
  {k:"deload", a:"2026-11-24", b:"2026-11-30", label:"Deload"},
  {k:"p2",     a:"2026-12-01", b:"2027-02-22", label:"Program 2"}
];
/* Tue-Thu = session 1, Fri-Sun = session 2. Monday rest. JS getDay: Sun=0. */
var DTYPE = {0:["legs",2],2:["push",1],3:["pull",1],4:["legs",1],5:["push",2],6:["pull",2]};
var COLOR = {push:"var(--push)",pull:"var(--pull)",legs:"var(--legs)"};

function phase(d){
  var s = ds(d);
  for(var i=0;i<PHASES.length;i++){
    var p = PHASES[i];
    if(s >= p.a && s <= p.b) return p;
  }
  return null;
}
function dayInfo(d){
  var p = phase(d), s = ds(d);
  if(!p) return {kind: s < PHASES[0].a ? "pre" : "done"};
  if(p.k === "ramp"){
    var e = null;
    for(var i=0;i<D.ramp.length;i++) if(D.ramp[i][0] === s) e = D.ramp[i];
    return {kind:"ramp", p:p, entry:e, week:Math.floor(daysBetween(pd(p.a),d)/7)+1};
  }
  var pair = DTYPE[d.getDay()];
  var week = Math.floor(daysBetween(pd(p.a), d)/7)+1;
  if(!pair) return {kind:"rest", p:p, week:week};
  var pk = p.k === "deload" ? "dl" : p.k;
  var info = {kind: p.k==="deload" ? "deload" : "train", p:p, pk:pk,
              dt:pair[0], sess:pair[1], week:week, color:COLOR[pair[0]]};
  info.logged = hasLog(pk, info.dt, week, info.sess);
  return info;
}
function progPhase(pk){ return pk === "dl" ? "p1" : pk; }

/* ---------------------------------------------------------------- program access */
function rows(pk, dt){ return D.program[progPhase(pk)][dt]; }
function rowFor(pk, dt, name){
  var rr = rows(pk, dt);
  for(var i=0;i<rr.length;i++) if(rr[i].n === name) return rr[i];
  return null;
}
function lkey(pk,dt,w,sess,ex){ return [pk,dt,w,sess,ex].join("|"); }
function bkey(pk,dt,ex){ return [progPhase(pk),dt,ex].join("|"); }

function hasLog(pk,dt,w,sess){
  var pre = [pk,dt,w,sess,""].join("|");
  for(var k in S.logs){
    if(k.indexOf(pre) === 0){
      var a = S.logs[k];
      for(var i=0;i<a.length;i++) if(a[i] && a[i].w !== "" && a[i].w != null) return true;
    }
  }
  return false;
}
function firstSet(pk,dt,w,sess,ex){
  var a = S.logs[lkey(pk,dt,w,sess,ex)];
  if(!a || !a[0]) return null;
  var s = a[0];
  if(s.w === "" || s.w == null) return null;
  return {w:+s.w, r:(s.r===""||s.r==null) ? null : +s.r};
}
function adj(r, row){
  if(r == null) return 0;
  if(r >= row.mx) return row.inc;
  if(r < row.mn) return -row.inc;
  return 0;
}
/* Walks forward from base. No data -> +inc (projects the plan).
   Data -> re-anchor to what actually happened. Driver is session 1 set 1. */
function target(pk, dt, ex, week){
  var row = rowFor(pk, dt, ex);
  if(!row || row.k !== "lift") return null;
  var b = S.base[bkey(pk,dt,ex)];
  if(b == null || b === "") return null;
  var t = +b, pp = progPhase(pk);
  for(var w=1; w<week; w++){
    var src = firstSet(pp,dt,w,1,ex) || firstSet(pp,dt,w,2,ex);
    if(!src) t += row.inc;
    else t = src.w + adj(src.r, row);
  }
  return t;
}
function deloadTarget(dt, ex){
  var t = target("p1", dt, ex, 12);
  if(t == null) return null;
  return Math.max(0, Math.round(t*0.6/5)*5);
}

/* ---------------------------------------------------------------- rest timer */
var restEnd = 0, restTick = null;
function startRest(sec){
  restEnd = Date.now() + sec*1000;
  document.getElementById("timer").style.display = "flex";
  clearInterval(restTick);
  restTick = setInterval(tickRest, 250);
  tickRest();
}
function tickRest(){
  var left = Math.max(0, Math.round((restEnd - Date.now())/1000));
  document.getElementById("tval").textContent =
    Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
  if(left <= 0){ stopRest(); }
}
function stopRest(){
  clearInterval(restTick); restTick = null;
  document.getElementById("timer").style.display = "none";
}
function addRest(s){ restEnd += s*1000; tickRest(); }

/* ---------------------------------------------------------------- nav */
var TABS = [["today","Today","\u25CF"],["cal","Calendar","\u25A6"],["plan","Plan","\u2261"],
            ["mob","Mobility","\u2726"],["you","You","\u25CB"]];
var tab = "today";
function go(t){ tab = t; render(); window.scrollTo(0,0); }
function goDate(s){ viewDate = pd(s); tab = "today"; render(); window.scrollTo(0,0); }
function renderNav(){
  document.getElementById("nav").innerHTML = TABS.map(function(t){
    return '<button class="'+(tab===t[0]?"on":"")+'" onclick="go(\''+t[0]+'\')">'+
           '<span class="ic">'+t[2]+'</span>'+t[1]+'</button>';
  }).join("");
}

/* ---------------------------------------------------------------- header */
function renderHeader(){
  var h = document.getElementById("hd");
  if(tab !== "today"){ h.innerHTML = ""; return; }
  var i = dayInfo(viewDate);
  var sub = "";
  if(i.kind === "train" || i.kind === "rest") sub = i.p.label+" \u00B7 week "+i.week;
  else if(i.kind === "deload") sub = "Deload week";
  else if(i.kind === "ramp") sub = "Ramp-up";
  else if(i.kind === "pre") sub = "Before the program starts";
  else sub = "Program complete";
  var isToday = ds(viewDate) === ds(TODAY);
  h.innerHTML =
    '<div class="datebar">'+
      '<button class="arw" onclick="step(-1)" aria-label="Previous day">\u2039</button>'+
      '<div class="dwrap"><div class="d1">'+
        viewDate.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"})+
      '</div><div class="d2">'+sub+'</div></div>'+
      (isToday ? '' : '<button class="todaybtn" onclick="goDate(\''+ds(TODAY)+'\')">Today</button>')+
      '<button class="arw" onclick="step(1)" aria-label="Next day">\u203A</button>'+
    '</div>';
}
function step(n){ viewDate = addDays(viewDate, n); render(); }

/* ---------------------------------------------------------------- Today */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }

function screenToday(){
  var i = dayInfo(viewDate), h = "";
  if(i.kind === "pre") return '<div class="wrap"><div class="card"><div class="ch">'+
    '<div class="exname">Nothing scheduled yet</div><div class="note" style="margin-top:6px">'+
    'The ramp-up starts Aug 17, 2026. Use the Plan tab to look ahead.</div></div></div></div>';
  if(i.kind === "done") return '<div class="wrap"><div class="card"><div class="ch">'+
    '<div class="exname">Program complete</div><div class="note" style="margin-top:6px">'+
    'Feb 21, 2027 was the last scheduled day. Time to write the next block.</div></div></div></div>';

  if(i.kind === "ramp"){
    var e = i.entry;
    h = '<div class="wrap"><div class="eyebrow">Ramp-up</div><h2 class="scr">'+esc(e?e[2]:"Rest")+'</h2>';
    if(e && e[2].indexOf("BASELINE") === 0)
      h += '<div class="warn"><b>Baseline test day.</b> Whatever you hit today becomes your Week 1 target. '+
           'Aim for the top of each rep range with about 2 reps left in the tank, then enter those numbers '+
           'on the Plan tab. Go conservative — the app adds weight for you every week.</div>';
    h += '<div class="card"><div class="ch"><div class="note">'+esc(e?e[3]:"Rest day. Walk.")+'</div></div></div>';
    var dn = !!S.ramp[ds(viewDate)];
    h += '<button class="btn '+(dn?"on":"")+'" onclick="toggleRamp()">'+(dn?"\u2713 Done":"Mark done")+'</button>';
    return h+"</div>";
  }

  if(i.kind === "rest"){
    h = '<div class="wrap"><div class="eyebrow">'+esc(i.p.label)+' \u00B7 week '+i.week+'</div>'+
        '<h2 class="scr">Rest day</h2>'+
        '<div class="card"><div class="ch"><div class="note">'+
        'Walk 30\u201345 min, easy incline. Hit your 8\u201310k steps. This is where most of the '+
        'deficit actually gets defended.</div></div></div>'+
        '<div class="card"><div class="ch"><div class="exname">Optional: golf mobility</div>'+
        '<div class="note" style="margin-top:5px">12 min. This is the work that pushes your rotation '+
        'numbers past the threshold the cool-downs alone don\u2019t reach.</div></div>'+
        '<div style="padding:0 14px 13px"><button class="btn sm" onclick="go(\'mob\');mobTab=\'golf\';render()">Open golf routine</button></div></div>';
    return h+weighInCard()+"</div>";
  }

  /* training day */
  var pk = i.pk, dt = i.dt, w = i.week, sess = i.sess;
  var rr = rows(pk, dt), deload = i.kind === "deload";
  h = '<div class="wrap"><div class="eyebrow" style="color:'+i.color+'">'+
      dt.toUpperCase()+' \u00B7 Session '+sess+'</div>'+
      '<h2 class="scr">'+(deload ? "Deload" : i.p.label+" \u00B7 week "+w)+'</h2>';

  if(deload) h += '<div class="warn"><b>Deload week.</b> Same exercises, 60% of your week-12 weights, '+
                  'half the sets. Twelve weeks of adding weight has a cost — this is where you collect it. '+
                  'It is not optional and it is not a rest week.</div>';

  for(var n=0;n<rr.length;n++){
    var row = rr[n];
    if(row.k === "warmup" || row.k === "cooldown") h += routineCard(row, pk, dt, w, sess);
    else h += exCard(row, pk, dt, w, sess, dt, deload);
  }

  var ex = S.extras[[pk,dt,w].join("|")] || [];
  for(var e2=0;e2<ex.length;e2++) h += extraCard(ex[e2], pk, dt, w, sess);
  h += '<button class="btn" onclick="addExtra()">+ Add exercise</button>';
  return h + weighInCard() + "</div>";
}

function routineCard(row, pk, dt, w, sess){
  var kind = row.k;
  var list = (kind === "warmup" ? D.mob.warmup : D.mob.cooldown)[dt] || [];
  var dk = [pk,dt,w,sess,kind].join("|");
  var done = !!S.done[dk];
  var open = !!openRoutine[dk];
  var mins = kind === "warmup" ? 5 : D.mob.cost[dt.charAt(0).toUpperCase()+dt.slice(1)];
  var h = '<div class="card"><div class="ch" onclick="toggleRoutine(\''+dk+'\')" style="cursor:pointer">'+
    '<div class="dn"><div class="exname">'+(kind==="warmup"?"Warm-up":"Cool-down stretch")+'</div>'+
    '<div class="dose">'+mins+' min '+(open?"\u2303":"\u2304")+'</div></div>'+
    '<div class="meta">'+(kind==="warmup"?"Dynamic, before lifting":"Static holds, after lifting")+
    ' \u00B7 '+list.length+' drills</div></div>';
  if(open){
    for(var i=0;i<list.length;i++){
      var d = list[i];
      h += '<div class="drill'+(d.pri?" pri":"")+'"><div class="dn"><b>'+esc(d.n)+'</b>'+
           '<span class="dose">'+esc(d.dose)+'</span></div>'+
           '<div class="dhow">'+esc(d.how)+'</div>'+
           '<a class="vid" href="'+d.url+'" target="_blank" rel="noopener">\u25B6 How to</a></div>';
    }
  }
  h += '<div style="padding:11px 14px"><button class="btn sm '+(done?"on":"")+'" '+
       'onclick="toggleDone(\''+dk+'\')">'+(done?"\u2713 Done":"Mark done")+'</button></div>';
  return h+"</div>";
}
var openRoutine = {};
function toggleRoutine(k){ openRoutine[k] = !openRoutine[k]; render(); }
function toggleDone(k){ if(S.done[k]) delete S.done[k]; else S.done[k] = true; save(); render(); }
function toggleRamp(){
  var k = ds(viewDate);
  if(S.ramp[k]) delete S.ramp[k]; else S.ramp[k] = true;
  save(); render();
}

function exCard(row, pk, dt, w, sess, cls, deload){
  var t = deload ? deloadTarget(dt, row.n) : target(pk, dt, row.n, w);
  var nsets = deload && row.s ? Math.ceil(row.s/2) : row.s;
  var cardio = row.k === "cardio";
  var h = '<div class="card '+cls+'"><div class="ch"><div class="exname">'+esc(row.n)+'</div>'+
    '<div class="meta">'+(cardio ? "Log minutes or meters"
      : nsets+" sets \u00B7 "+row.mn+"\u2013"+row.mx+" reps \u00B7 "+row.rest+"s rest")+'</div></div>';
  if(!cardio){
    h += '<div class="tgtrow"><span class="tgt" style="color:'+(t==null?"var(--dim)":COLOR[dt])+'">'+
         (t == null ? "\u2014" : t)+'</span><span class="tgtlab">'+
         (t == null ? "set a starting weight on Plan" : "lb target")+'</span></div>';
  }
  var arr = S.logs[lkey(pk,dt,w,sess,row.n)] || [];
  var count = cardio ? 1 : nsets;
  for(var s=0;s<count;s++){
    var v = arr[s] || {w:"",r:""};
    h += '<div class="setrow"><span class="setn">'+(cardio?"\u2014":s+1)+'</span>'+
      inp(pk,dt,w,sess,row.n,s,"w",v.w, cardio ? "min / m" : (t==null?"lb":String(t)))+
      (cardio ? '' : '<span class="x">\u00D7</span>'+
        inp(pk,dt,w,sess,row.n,s,"r",v.r, row.mn+"\u2013"+row.mx))+
      (cardio || !row.rest ? '' :
        '<button class="btn sm" style="flex:0 0 auto;width:52px;padding:9px 0" '+
        'onclick="startRest('+row.rest+')">'+Math.round(row.rest/60*10)/10+'m</button>')+
      '</div>';
  }
  if(row.cue) h += '<div style="padding:9px 14px 12px"><div class="dcue">'+esc(row.cue)+'</div></div>';
  return h+"</div>";
}
function inp(pk,dt,w,sess,ex,s,f,val,ph){
  var id = [pk,dt,w,sess,ex,s,f].join("\u0001");
  return '<input class="inp'+(val!==""&&val!=null?" filled":"")+'" inputmode="decimal" '+
         'placeholder="'+esc(ph)+'" value="'+esc(val==null?"":val)+'" '+
         'oninput="setLog(this,\''+esc(id).replace(/\u0001/g,"\\u0001")+'\')">';
}
function setLog(el, id){
  var a = id.split("\u0001");
  var key = lkey(a[0],a[1],a[2],a[3],a[4]), s = +a[5], f = a[6];
  if(!S.logs[key]) S.logs[key] = [];
  while(S.logs[key].length <= s) S.logs[key].push({w:"",r:""});
  S.logs[key][s][f] = el.value;
  el.classList.toggle("filled", el.value !== "");
  save();
}

function extraCard(name, pk, dt, w, sess){
  var arr = S.logs[lkey(pk,dt,w,sess,name)] || [];
  var h = '<div class="card"><div class="ch"><div class="dn"><div class="exname">'+esc(name)+'</div>'+
    '<button class="dose" onclick="removeExtra(\''+esc(name).replace(/'/g,"\\'")+'\')">remove</button></div>'+
    '<div class="meta">Extra \u00B7 this week only \u00B7 no auto-progression</div></div>';
  for(var s=0;s<4;s++){
    var v = arr[s] || {w:"",r:""};
    h += '<div class="setrow"><span class="setn">'+(s+1)+'</span>'+
      inp(pk,dt,w,sess,name,s,"w",v.w,"lb")+'<span class="x">\u00D7</span>'+
      inp(pk,dt,w,sess,name,s,"r",v.r,"reps")+'</div>';
  }
  return h+"</div>";
}
function addExtra(){
  var i = dayInfo(viewDate);
  var list = D.lists[i.dt];
  var name = window.prompt("Exercise name (type any part, or paste from the Plan tab):", "");
  if(!name) return;
  var lower = name.toLowerCase(), match = null;
  for(var j=0;j<list.length;j++){
    if(list[j].toLowerCase() === lower){ match = list[j]; break; }
    if(!match && list[j].toLowerCase().indexOf(lower) >= 0) match = list[j];
  }
  var chosen = match || name;
  var k = [i.pk,i.dt,i.week].join("|");
  if(!S.extras[k]) S.extras[k] = [];
  if(S.extras[k].indexOf(chosen) < 0) S.extras[k].push(chosen);
  save(); render();
  toast("Added "+chosen);
}
function removeExtra(name){
  var i = dayInfo(viewDate), k = [i.pk,i.dt,i.week].join("|");
  var a = S.extras[k] || [];
  var x = a.indexOf(name); if(x >= 0) a.splice(x,1);
  save(); render();
}

function weighInCard(){
  var k = ds(viewDate), v = S.weights[k];
  return '<div class="card"><div class="ch"><div class="dn"><div class="exname">Weigh-in</div>'+
    '<span class="dose">'+(v!=null&&v!==""?v+" lb":"\u2014")+'</span></div>'+
    '<div class="meta">Morning, after the bathroom, before food</div></div>'+
    '<div class="setrow"><input class="inp'+(v!=null&&v!==""?" filled":"")+'" inputmode="decimal" '+
    'placeholder="lb" value="'+(v==null?"":v)+'" oninput="setWeight(this.value)"></div></div>';

function setWeight(v){

  save();
}

/* ---------------------------------------------------------------- Calendar */
var calCursor = null;
function screenCal(){
  if(!calCursor) calCursor = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1);
  var y = calCursor.getFullYear(), m = calCursor.getMonth();
  var first = new Date(y,m,1), start = new Date(y,m,1-first.getDay());
  var h = '<div class="wrap">'+
    '<div class="datebar" style="padding:0 0 12px">'+
      '<button class="arw" onclick="calStep(-1)">\u2039</button>'+
      '<div class="dwrap"><div class="d1">'+
        first.toLocaleDateString(undefined,{month:"long",year:"numeric"})+'</div></div>'+
      '<button class="arw" onclick="calStep(1)">\u203A</button>'+
    '</div><div class="cal">';
  ["S","M","T","W","T","F","S"].forEach(function(d){ h += '<div class="dow">'+d+'</div>'; });

  for(var n=0;n<42;n++){
    var d = addDays(start,n), i = dayInfo(d), s = ds(d);
    var off = d.getMonth() !== m, isT = s === ds(TODAY);
    h += '<button class="cell'+(off?" off":"")+(isT?" today":"")+'" onclick="goDate(\''+s+'\')">'+
         '<span class="dnum">'+d.getDate()+'</span>';
    if(i.kind === "train" || i.kind === "deload"){
      var col = i.color;
      h += '<span class="dot" style="'+(i.logged
             ? 'background:'+col+';border-color:'+col
             : 'border-color:'+col)+'"></span>'+
           '<span class="sl">'+(i.kind==="deload"?"DL":"S"+i.sess)+'</span>';
    } else if(i.kind === "ramp"){
      var e = i.entry, isRest = !e || e[2].indexOf("Rest") === 0;
      h += '<span class="dot" style="border-color:var(--dim)"></span>'+
           '<span class="rest">'+(isRest?"walk":"ramp")+'</span>';
    } else if(i.kind === "rest"){
      h += '<span class="dot" style="border-color:transparent"></span><span class="rest">rest</span>';
    } else {
      h += '<span class="dot" style="border-color:transparent"></span><span class="rest"></span>';
    }
    var wv = S.weights[s];
    h += '<span class="wt">'+(wv!=null&&wv!==""?wv:"")+'</span></button>';
  }
  h += '</div>';

  /* footer stats — past and today only */
  var done = 0, sched = 0;
  for(var p=0;p<PHASES.length;p++){
    var ph = PHASES[p];
    if(ph.k === "ramp") continue;
    var a = pd(ph.a), b = pd(ph.b);
    for(var d2=a; ds(d2) <= ds(b); d2 = addDays(d2,1)){
      if(ds(d2) > ds(TODAY)) break;
      var ii = dayInfo(d2);
      if(ii.kind === "train" || ii.kind === "deload"){ sched++; if(ii.logged) done++; }
    }
  }
  var rate = sched ? Math.round(done/sched*100) : null;
  var rcol = rate == null ? "var(--dim)"
           : rate >= 85 ? "var(--legs)" : rate >= 65 ? "var(--gold)" : "var(--push)";
  h += '<div class="stat"><div><div class="v">'+done+'</div><div class="l">Sessions done</div></div>'+
       '<div><div class="v">'+sched+'</div><div class="l">Scheduled</div></div>'+
       '<div><div class="v" style="color:'+rcol+'">'+
       (rate == null ? "\u2014" : rate+"%")+'</div><div class="l">Hit rate</div></div></div>'+
       '<div class="note" style="margin-top:12px">Filled dot = logged. Hollow = scheduled, not logged. '+
       'Gold number = that morning\u2019s weigh-in. Tap any day to open it.</div></div>';
  return h;
}
function calStep(n){
  calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth()+n, 1);
  render();
}

       'each rep range. Log a real set and every week after it recalculates from what actually happened.</div>';

    '<hr class="sep"><button class="btn" style="color:var(--push);border-color:rgba(224,82,75,.4)" '+
      'onclick="wipe()">Erase all data</button>'+
    '<div class="note" style="margin-top:19px;color:var(--dim)">Program built from the training system '+
    'workbook. Progression math matches the spreadsheet exactly. Get physician clearance before starting '+
    '\u2014 this app is not medical advice.</div>';
  return h+"</div>";
}
function exportData(){
  var s = JSON.stringify(S,null,2);
  try{
    var b = new Blob([s],{type:"application/json"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    a.download = "gym-backup-"+ds(new Date())+".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
    toast("Backup downloaded");
  }catch(e){ copyData(); }
}
function copyData(){
  var s = JSON.stringify(S);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(s).then(function(){ toast("Copied — paste it somewhere safe"); },
      function(){ fallbackCopy(s); });
  } else fallbackCopy(s);
}
function fallbackCopy(s){
  var ta = document.createElement("textarea");
  ta.value = s; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast("Copied"); }
  catch(e){ toast("Copy failed — use Export instead"); }
  document.body.removeChild(ta);
}
function importData(){
  var v = document.getElementById("impbox").value.trim();
  if(!v) return;
  var p;
  try{ p = JSON.parse(v); }
  catch(e){ toast("That isn't valid backup data"); return; }
  if(!window.confirm("Replace everything currently logged with this backup?")) return;
  var o = JSON.parse(JSON.stringify(BLANK));
  for(var k in BLANK) if(p[k]) o[k] = p[k];
  S = o; save(); render(); toast("Restored");
}
function wipe(){
  if(!window.confirm("Erase every logged set, weigh-in and test result? This cannot be undone.")) return;
  if(!window.confirm("Last check — export a backup first if you want to keep any of it. Erase now?")) return;
  S = JSON.parse(JSON.stringify(BLANK));
  try{ localStorage.removeItem(KEY); }catch(e){}
  render(); toast("Erased");
}

/* ---------------------------------------------------------------- render */
function render(){
  renderHeader(); renderNav();
  var el = document.getElementById("screen");
  if(tab === "today") el.innerHTML = screenToday();
  else if(tab === "cal") el.innerHTML = screenCal();
  else if(tab === "plan") el.innerHTML = screenPlan();
  else if(tab === "mob") el.innerHTML = screenMob();
  else el.innerHTML = screenYou();
}
render();
</script>
